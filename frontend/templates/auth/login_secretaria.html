{% extends 'base.html' %}

{% block title %}Inicio de Sesión - Secretaria{% endblock %}

{% block extra_css %}
<style>
  .login-card {
    max-width: 450px;
    margin: 3rem auto;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  .login-header {
    background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
    color: white;
    padding: 2rem;
    text-align: center;
    border-radius: 0.375rem 0.375rem 0 0;
  }
  .role-icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12">
    <div class="card login-card">
      <div class="login-header">
        <div class="role-icon">📋</div>
        <h3 class="mb-0">Secretaria Académica</h3>
        <p class="mb-0 mt-2 opacity-75">Sistema de Validación de Informes</p>
      </div>
      
      <div class="card-body p-4">
        <form method="post" action="{% url 'login_secretaria' %}">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Código de Secretaria</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input 
                type="text" 
                class="form-control" 
                id="username" 
                name="username" 
                placeholder="Ingrese su código"
                required
                autofocus
              >
            </div>
          </div>
          
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password" 
                placeholder="Ingrese su contraseña"
                required
              >
            </div>
          </div>
          
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>
              Iniciar Sesión
            </button>
          </div>
        </form>
      </div>
      
      <div class="card-footer text-center bg-light">
        <small class="text-muted">
          ¿Eres de otro rol? 
          <a href="{% url 'login' %}" class="text-decoration-none">Estudiante</a> | 
          <a href="{% url 'login_docente' %}" class="text-decoration-none">Docente</a> | 
          <a href="{% url 'login_presidente' %}" class="text-decoration-none">Presidente</a>
        </small>
      </div>
    </div>
  </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Validación – UNTELS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --untels-blue: #1a3a6b;
      --untels-gold: #f0a500;
    }
    body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    .navbar { background-color: var(--untels-blue) !important; }
    .navbar-brand { color: #fff !important; font-weight: 700; letter-spacing: 0.5px; }
    .navbar-text { color: var(--untels-gold) !important; font-size: 0.85rem; }
    .btn-untels {
      background-color: var(--untels-blue);
      color: #fff;
      border: none;
    }
    .btn-untels:hover {
      background-color: var(--untels-gold);
      color: #1a3a6b;
    }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card-header-untels {
      background-color: var(--untels-blue);
      color: #fff;
      border-radius: 12px 12px 0 0 !important;
      padding: 1rem 1.5rem;
    }
    .badge-estudiante { background-color: var(--untels-blue); }
    .badge-egresado { background-color: #5a6e8c; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <span class="navbar-brand">
        🎓 Sistema de Validación de Informes – UNTELS
      </span>
      <span class="navbar-text">Prácticas Preprofesionales</span>
    </div>
  </nav>

  <div class="container py-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
